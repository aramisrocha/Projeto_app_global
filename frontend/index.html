<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro de Ponto - Global Lab</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { margin-bottom: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
    label { display:block; font-size: 12px; margin-top: 10px; color:#333; }
    input, select, button { width: 100%; padding: 10px; margin-top: 6px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; font-size: 14px; }
    .muted { color:#666; font-size: 12px; }
    .ok { color: #0a7; }
    .err { color: #c00; }
    .actions { display:flex; gap:10px; margin-top: 10px; }
    .actions button { width:auto; padding: 10px 14px; }
    code { background:#f6f6f6; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Registro de Ponto - Global Lab</h1>
  <p class="muted">API: <code id="apiUrlLabel"></code></p>

  <div class="row">
    <div class="card">
      <h2>Criar Funcionário</h2>

      <label>ID</label>
      <input id="empId" placeholder="emp-001" />

      <label>Nome</label>
      <input id="empName" placeholder="Aramis Rocha" />

      <label>Email</label>
      <input id="empEmail" placeholder="aramis@email.com" />

      <label>Timezone</label>
      <input id="empTz" value="America/Sao_Paulo" />

      <div class="actions">
        <button onclick="createEmployee()">Criar</button>
        <button onclick="loadEmployees()">Recarregar lista</button>
      </div>

      <p id="empMsg" class="muted"></p>
    </div>

    <div class="card">
      <h2>Bater Ponto</h2>

      <label>Funcionário</label>
      <select id="clockEmployee"></select>

      <label>Tipo</label>
      <select id="clockType">
        <option value="IN">IN</option>
        <option value="OUT">OUT</option>
      </select>

      <div class="actions">
        <button onclick="clockInOut()">Registrar</button>
        <button onclick="loadClock()">Ver últimos registros</button>
      </div>

      <p id="clockMsg" class="muted"></p>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2>Funcionários</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nome</th><th>Email</th><th>Timezone</th>
        </tr>
      </thead>
      <tbody id="employeesTable"></tbody>
    </table>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2>Últimos registros (20)</h2>
    <table>
      <thead>
        <tr>
          <th>EmployeeId</th><th>Timestamp (UTC)</th><th>Tipo</th>
        </tr>
      </thead>
      <tbody id="clockTable"></tbody>
    </table>
  </div>

<script>
  // Ajuste se sua API estiver em outra porta/host
  const API_URL = "https://apiglobal.aramislabs.click";
  document.getElementById("apiUrlLabel").textContent = API_URL;

  function setMsg(id, text, ok=true) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = ok ? "ok" : "err";
  }

  async function api(path, options={}) {
    const res = await fetch(`${API_URL}${path}`, {
      headers: { "Content-Type": "application/json" },
      ...options
    });
    const contentType = res.headers.get("content-type") || "";
    const data = contentType.includes("application/json") ? await res.json() : await res.text();
    if (!res.ok) {
      const detail = data?.detail ? data.detail : JSON.stringify(data);
      throw new Error(detail);
    }
    return data;
  }

  async function createEmployee() {
    try {
      const payload = {
        id: document.getElementById("empId").value.trim(),
        name: document.getElementById("empName").value.trim(),
        email: document.getElementById("empEmail").value.trim(),
        timezone: document.getElementById("empTz").value.trim() || "America/Sao_Paulo",
      };
      if (!payload.id || !payload.name || !payload.email) {
        setMsg("empMsg", "Preencha id, nome e email.", false);
        return;
      }

      const created = await api("/employees", { method:"POST", body: JSON.stringify(payload) });
      setMsg("empMsg", `Criado: ${created.id} (${created.name})`, true);
      await loadEmployees();
    } catch (e) {
      setMsg("empMsg", `Erro: ${e.message}`, false);
    }
  }

  async function loadEmployees() {
    try {
      const employees = await api("/employees");
      // tabela
      const tbody = document.getElementById("employeesTable");
      tbody.innerHTML = employees.map(e => `
        <tr>
          <td>${escapeHtml(e.id)}</td>
          <td>${escapeHtml(e.name)}</td>
          <td>${escapeHtml(e.email)}</td>
          <td>${escapeHtml(e.timezone)}</td>
        </tr>
      `).join("");

      // select
      const sel = document.getElementById("clockEmployee");
      sel.innerHTML = employees.map(e => `<option value="${escapeAttr(e.id)}">${escapeHtml(e.id)} - ${escapeHtml(e.name)}</option>`).join("");

      if (employees.length === 0) {
        sel.innerHTML = `<option value="">(nenhum funcionário)</option>`;
      }

      setMsg("empMsg", `Carregado(s): ${employees.length}`, true);
    } catch (e) {
      setMsg("empMsg", `Erro ao carregar: ${e.message}`, false);
    }
  }

  async function clockInOut() {
    try {
      const employeeId = document.getElementById("clockEmployee").value;
      const type = document.getElementById("clockType").value;

      if (!employeeId) {
        setMsg("clockMsg", "Crie um funcionário primeiro.", false);
        return;
      }

      const rec = await api("/clock", { method:"POST", body: JSON.stringify({ employeeId, type }) });
      setMsg("clockMsg", `Registrado: ${rec.employeeId} ${rec.type} em ${rec.timestampUtc}`, true);
      await loadClock();
    } catch (e) {
      setMsg("clockMsg", `Erro: ${e.message}`, false);
    }
  }

  async function loadClock() {
    try {
      const employeeId = document.getElementById("clockEmployee").value;
      if (!employeeId) {
        setMsg("clockMsg", "Selecione um funcionário.", false);
        return;
      }

      const records = await api(`/clock/${encodeURIComponent(employeeId)}`);
      const tbody = document.getElementById("clockTable");
      tbody.innerHTML = records.map(r => `
        <tr>
          <td>${escapeHtml(r.employeeId)}</td>
          <td>${escapeHtml(r.timestampUtc)}</td>
          <td>${escapeHtml(r.type)}</td>
        </tr>
      `).join("");

      setMsg("clockMsg", `Registros carregados: ${records.length}`, true);
    } catch (e) {
      setMsg("clockMsg", `Erro ao carregar: ${e.message}`, false);
    }
  }

  function escapeHtml(str) {
    return String(str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(str){ return escapeHtml(str).replaceAll("`","&#096;"); }

  // carrega tudo ao abrir
  loadEmployees();
</script>
</body>
</html>
