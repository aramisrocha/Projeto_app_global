AWSTemplateFormatVersion: "2010-09-09"
Description: "DynamoDB - Sistema de Pontos (single-table design) + employees/clock tables (Global Tables)"

Parameters:
  ProjectName:
    Type: String
    Description: "Nome do projeto (ex: app-global)"

  Environment:
    Type: String
    AllowedValues: [dev, hml, prd]
    Description: "Ambiente de deploy"

  TableName:
    Type: String
    Default: ""
    Description: "Opcional: nome da tabela Points. Se vazio, será gerado automaticamente."

  EnableTTL:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: "Habilitar TTL nas tabelas"

  TTLAttributeName:
    Type: String
    Default: "ttl"
    Description: "Nome do atributo TTL (Unix epoch em segundos)"

  EnablePITR:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: "Habilitar Point-in-time recovery (PITR)"

Conditions:
  HasCustomTableName: !Not [!Equals [!Ref TableName, ""]]
  TTLIsEnabled: !Equals [!Ref EnableTTL, "true"]
  PITRIsEnabled: !Equals [!Ref EnablePITR, "true"]

Resources:

  # ---------------------------------------------------------------------------
  # POINTS TABLE — Global Table (multi-region)
  # Motivo: tinha Replicas indevidamente em AWS::DynamoDB::Table.
  # AWS::DynamoDB::GlobalTable é o tipo correto para replicação multi-região.
  # StreamSpecification é OBRIGATÓRIO em GlobalTable.
  # ---------------------------------------------------------------------------
  PointsGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !If
        - HasCustomTableName
        - !Ref TableName
        - !Sub "${ProjectName}-${Environment}-points"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      # OBRIGATÓRIO para GlobalTable
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      # Réplicas devem ficar aqui (GlobalTable), não em AWS::DynamoDB::Table
      Replicas:
        - Region: us-east-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "points"
        - Region: eu-west-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "points"

      SSESpecification:
        SSEEnabled: true

      TimeToLiveSpecification: !If
        - TTLIsEnabled
        - AttributeName: !Ref TTLAttributeName
          Enabled: true
        - !Ref "AWS::NoValue"

  # ---------------------------------------------------------------------------
  # EMPLOYEES TABLE — Global Table (multi-region)
  # Motivo: o template original declarava AWS::DynamoDB::Table + AWS::DynamoDB::GlobalTable
  # com o MESMO TableName, causando conflito. Unificado em GlobalTable.
  # ---------------------------------------------------------------------------
  EmployeesGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-employees"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

      # OBRIGATÓRIO para GlobalTable
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      Replicas:
        - Region: us-east-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "employees"
        - Region: eu-west-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "employees"

      SSESpecification:
        SSEEnabled: true

      TimeToLiveSpecification:
        # Usando o parâmetro TTLAttributeName para consistência
        AttributeName: !Ref TTLAttributeName
        Enabled: true

  # ---------------------------------------------------------------------------
  # CLOCK TABLE — Global Table (multi-region)
  # Motivo: mesmo problema do Employees — dois recursos com o mesmo TableName.
  # Unificado em GlobalTable. StreamSpecification adicionado (obrigatório).
  # ---------------------------------------------------------------------------
  ClockGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-clock"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: employeeId
          AttributeType: S
        - AttributeName: timestampUtc
          AttributeType: S

      KeySchema:
        - AttributeName: employeeId
          KeyType: HASH
        - AttributeName: timestampUtc
          KeyType: RANGE

      # OBRIGATÓRIO para GlobalTable
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      Replicas:
        - Region: us-east-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "clock"
        - Region: eu-west-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "clock"

      SSESpecification:
        SSEEnabled: true

      TimeToLiveSpecification: !If
        - TTLIsEnabled
        - AttributeName: !Ref TTLAttributeName
          Enabled: true
        - !Ref "AWS::NoValue"

Outputs:
  PointsTableName:
    Description: "Nome da tabela Points"
    Value: !Ref PointsGlobalTable
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PointsTableName"

  PointsTableArn:
    Description: "ARN da tabela Points"
    Value: !GetAtt PointsGlobalTable.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PointsTableArn"

  PointsTableStreamArn:
    Description: "ARN do Stream da tabela Points"
    Value: !GetAtt PointsGlobalTable.StreamArn

  EmployeesTableName:
    Description: "Nome da tabela Employees"
    Value: !Ref EmployeesGlobalTable
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EmployeesTableName"

  EmployeesTableArn:
    Description: "ARN da tabela Employees"
    Value: !GetAtt EmployeesGlobalTable.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EmployeesTableArn"

  EmployeesTableStreamArn:
    Description: "ARN do Stream da tabela Employees"
    Value: !GetAtt EmployeesGlobalTable.StreamArn

  ClockTableName:
    Description: "Nome da tabela Clock"
    Value: !Ref ClockGlobalTable
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ClockTableName"

  ClockTableArn:
    Description: "ARN da tabela Clock"
    Value: !GetAtt ClockGlobalTable.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ClockTableArn"

  ClockTableStreamArn:
    Description: "ARN do Stream da tabela Clock"
    Value: !GetAtt ClockGlobalTable.StreamArn