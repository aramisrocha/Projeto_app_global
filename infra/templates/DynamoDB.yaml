AWSTemplateFormatVersion: "2010-09-09"
Description: "DynamoDB - Points system (single-table design) + employees/clock tables (Global Tables)"

Parameters:
  ProjectName:
    Type: String
    Description: "Project name"

  Environment:
    Type: String
    AllowedValues: [dev, hml, prd]
    Description: "Deployment environment"

  TableName:
    Type: String
    Default: ""
    Description: "Optional custom table name — defaults to {ProjectName}-{Environment}-points if left empty"

  EnableTTL:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: "Enable TTL for automatic item expiration"

  TTLAttributeName:
    Type: String
    Default: "ttl"
    Description: "Attribute name used for TTL expiration"

  EnablePITR:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: "Enable Point-in-Time Recovery (PITR)"

Conditions:
  # Resolves whether a custom table name was provided
  HasCustomTableName: !Not [!Equals [!Ref TableName, ""]]
  TTLIsEnabled: !Equals [!Ref EnableTTL, "true"]
  PITRIsEnabled: !Equals [!Ref EnablePITR, "true"]

Resources:

  # -------------------------------------------------------
  # Points table — single-table design with GSI
  # Replicated across us-east-1 and eu-west-1
  # -------------------------------------------------------
  PointsGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !If
        - HasCustomTableName
        - !Ref TableName
        - !Sub "${ProjectName}-${Environment}-points"
      # On-demand billing — no capacity planning required
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      # Required for GlobalTable — streams changes to all replicas
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      # Regional replicas — PITR configured per replica
      Replicas:
        - Region: us-east-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "points"
        - Region: eu-west-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "points"

      # Encryption at rest using AWS-managed keys
      SSESpecification:
        SSEEnabled: true

      # TTL conditionally enabled — expired items are automatically deleted
      TimeToLiveSpecification: !If
        - TTLIsEnabled
        - AttributeName: !Ref TTLAttributeName
          Enabled: true
        - !Ref "AWS::NoValue"

  
  # Employees table — keyed by id, GSI on email
  # Replicated across us-east-1 and eu-west-1
  EmployeesGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-employees"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      # Allows lookups by email without a full table scan
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

      # Required for GlobalTable — streams changes to all replicas
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      Replicas:
        - Region: us-east-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "employees"
        - Region: eu-west-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "employees"

      SSESpecification:
        SSEEnabled: true

      TimeToLiveSpecification:
        AttributeName: !Ref TTLAttributeName
        Enabled: true

  
  # Clock table — keyed by employeeId + timestampUtc
  # DeletionPolicy: Delete — clock records are audit data
  # Replicated across us-east-1 and eu-west-1
  ClockGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-clock"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: employeeId
          AttributeType: S
        - AttributeName: timestampUtc
          AttributeType: S

      # Composite key — enables range queries by employee and time
      KeySchema:
        - AttributeName: employeeId
          KeyType: HASH
        - AttributeName: timestampUtc
          KeyType: RANGE

      # Required for GlobalTable — streams changes to all replicas
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      Replicas:
        - Region: us-east-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "clock"
        - Region: eu-west-1
          PointInTimeRecoverySpecification: !If
            - PITRIsEnabled
            - PointInTimeRecoveryEnabled: true
            - PointInTimeRecoveryEnabled: false
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Service
              Value: "clock"

      SSESpecification:
        SSEEnabled: true

      TimeToLiveSpecification: !If
        - TTLIsEnabled
        - AttributeName: !Ref TTLAttributeName
          Enabled: true
        - !Ref "AWS::NoValue"

Outputs:
  PointsTableName:
    Description: "Points table name"
    Value: !Ref PointsGlobalTable
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PointsTableName"

  PointsTableArn:
    Description: "Points table ARN"
    Value: !GetAtt PointsGlobalTable.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PointsTableArn"

  PointsTableStreamArn:
    Description: "Points table stream ARN"
    Value: !GetAtt PointsGlobalTable.StreamArn

  EmployeesTableName:
    Description: "Employees table name"
    Value: !Ref EmployeesGlobalTable
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EmployeesTableName"

  EmployeesTableArn:
    Description: "Employees table ARN"
    Value: !GetAtt EmployeesGlobalTable.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EmployeesTableArn"

  EmployeesTableStreamArn:
    Description: "Employees table stream ARN"
    Value: !GetAtt EmployeesGlobalTable.StreamArn

  ClockTableName:
    Description: "Clock table name"
    Value: !Ref ClockGlobalTable
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ClockTableName"

  ClockTableArn:
    Description: "Clock table ARN"
    Value: !GetAtt ClockGlobalTable.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ClockTableArn"

  ClockTableStreamArn:
    Description: "Clock table stream ARN"
    Value: !GetAtt ClockGlobalTable.StreamArn