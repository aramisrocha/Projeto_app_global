AWSTemplateFormatVersion: "2010-09-09"
Description: "ECS Fargate module - Cluster, TaskDefinition, Service, TG + ListenerRule, IAM Roles, Logs"

Parameters:
  ProjectName:
    Type: String
    Default: "app-global"

  VpcId:
    Type: AWS::EC2::VPC::Id

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Private subnets for ECS Fargate tasks"

  ServiceSecurityGroupEgressCidr:
    Type: String
    Default: "0.0.0.0/0"

  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "ALB Security Group — used to allow inbound traffic from ALB to ECS tasks"

  AlbListenerArn:
    Type: String
    Description: "ALB Listener ARN (HTTP 80) — defined in network.yaml"

  ListenerRulePriority:
    Type: Number
    Default: 10
    Description: "Listener rule priority — must be unique across all rules on the same listener"

  PathPattern:
    Type: String
    Default: "/*"
    Description: "Path pattern for the ALB listener rule"

  ContainerPort:
    Type: Number
    Default: 8000

  DesiredCount:
    Type: Number
    Default: 2

  MinTaskCount:
    Type: Number
    Default: 1
    Description: "Minimum number of tasks for Auto Scaling"

  MaxTaskCount:
    Type: Number
    Default: 10
    Description: "Maximum number of tasks for Auto Scaling"

  CPUTargetValue:
    Type: Number
    Default: 70
    Description: "Target average CPU utilization (%) for Target Tracking scaling"

  MemoryTargetValue:
    Type: Number
    Default: 75
    Description: "Target average memory utilization (%) for Target Tracking scaling"

  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]

  Memory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048", "3072", "4096", "5120", "6144", "7168", "8192", "16384", "30720"]

  AssignPublicIp:
    Type: String
    Default: "DISABLED"
    AllowedValues: ["ENABLED", "DISABLED"]

  ImageUri:
    Type: String
    Default: "181317788381.dkr.ecr.us-east-1.amazonaws.com/app_global:latest"
    Description: "Full image URI (repo:tag)"

  LogRetentionDays:
    Type: Number
    Default: 14

  HealthCheckPath:
    Type: String
    Default: "/health"

  EnvironmentEmployeesTable:
    Type: String
    Default: "Employees"

  EnvironmentClockTable:
    Type: String
    Default: "ClockRecords"

  DeploymentControllerType:
    Type: String
    Default: ECS
    AllowedValues:
      - ECS
      - CODE_DEPLOY
  EcsTaskRoleArn:
    Type: String
    Default: "arn:aws:iam::181317788381:role/app-global-ecs-task-role"

  EcsExecutionRoleArn:
    Type: String
    Default: "arn:aws:iam::181317788381:role/app-global-ecs-exec-role"
    

  EcsAutoScalingRoleArn:
    Type: String
    Default: "arn:aws:iam::181317788381:role/app-global-ecs-autoscaling-role"    

Resources:

  # CloudWatch Log Group for ECS task 
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: !Ref LogRetentionDays

  # Execution role — grants ECS agent permission to pull images and write logs
  

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
  

  # SG for ECS
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      GroupDescription: !Sub "SG for ${ProjectName} ECS Service"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: "Allow ALB to reach ECS tasks"
          IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroupId
      SecurityGroupEgress:
        - Description: "Egress"
          IpProtocol: -1
          CidrIp: !Ref ServiceSecurityGroupEgressCidr
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecs-svc-sg"

  # Blue target group — active production target, receives live traffic from the ALB listener rule
  AppTargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${ProjectName}-blue-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !Ref HealthCheckPath
      Matcher:
        HttpCode: "200-399"

  # Green target group — reserved for blue/green deployments via CodeDeploy
  AppTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${ProjectName}-green-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !Ref HealthCheckPath
      Matcher:
        HttpCode: "200-399"

  # Routes matched requests to the blue target group
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          Values:
            - !Ref PathPattern
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroupBlue

  # Defines CPU, memory, container image and IAM roles — awsvpc mode assigns a dedicated ENI per task
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Family: !Sub "${ProjectName}-task"
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref EcsExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: !Sub "${ProjectName}-container"
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          # Container-level health check
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "curl -f http://localhost:${ContainerPort}/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          Environment:
            - Name: EMPLOYEES_TABLE
              Value: "EMPLOYEES_TABLE"
            - Name: CLOCK_TABLE
              Value: "CLOCK_TABLE"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # DependsOn ListenerRule ensures the ALB is ready before the service registers targets
  # DeploymentConfiguration allows rolling updates with no full outage
  EcsService:
    Type: AWS::ECS::Service
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn:
      - ListenerRule
    Properties:
      ServiceName: !Sub "${ProjectName}-service"
      Cluster: !Ref EcsCluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentController:
        Type: !Ref DeploymentControllerType
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          AssignPublicIp: !Ref AssignPublicIp
      LoadBalancers:
        - ContainerName: !Sub "${ProjectName}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref AppTargetGroupBlue
      # MaximumPercent 200 allows doubling tasks during deployment before draining old ones
      # MinimumHealthyPercent 50 ensures at least half the tasks remain healthy during rollout
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50

  # Registers the ECS service as a scalable target for Application Auto Scaling
  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: EcsService
    Properties:
      MinCapacity: !Ref MinTaskCount
      MaxCapacity: !Ref MaxTaskCount
      ResourceId: !Sub "service/${EcsCluster}/${EcsService.Name}"
      #RoleARN: !GetAtt EcsAutoScalingRole.Arn
      RoleARN: !Ref EcsAutoScalingRoleArn
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  # Scales out after 1 min of high CPU, scales in after 2 min to avoid flapping
  ScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-cpu-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CPUTargetValue
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  # Scales out after 1 min of high memory, scales in after 2 min to avoid flapping
  ScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-memory-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref MemoryTargetValue
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization

Outputs:
  ClusterName:
    Value: !Ref EcsCluster

  ServiceName:
    Value: !Ref EcsService

  TargetGroupArn:
    Value: !Ref AppTargetGroupBlue

  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup


  TaskExecutionRoleArn:
    Value: !Ref EcsExecutionRoleArn

  TaskRoleArn:
    Value: !Ref EcsTaskRoleArn

  AutoScalingRoleArn:
    Value: !Ref EcsAutoScalingRoleArn