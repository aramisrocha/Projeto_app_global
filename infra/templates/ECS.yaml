AWSTemplateFormatVersion: "2010-09-09"
Description: "ECS Fargate module - Cluster, TaskDefinition, Service, TG + ListenerRule, IAM Roles, Logs"

Parameters:
  ProjectName:
    Type: String
    Default: "app-global"

  VpcId:
    Type: AWS::EC2::VPC::Id

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Subnets privadas para rodar o ECS Service (Fargate)"

  ServiceSecurityGroupEgressCidr:
    Type: String
    Default: "0.0.0.0/0"

  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "Security Group do ALB (criado no network.yaml)"

  AlbListenerArn:
    Type: String
    Description: "Listener ARN do ALB (ex: HTTP 80) - criado no network.yaml"

  ListenerRulePriority:
    Type: Number
    Default: 10
    Description: "Prioridade da regra no listener (deve ser única)"

  PathPattern:
    Type: String
    Default: "/*"
    Description: "Path pattern do listener rule"

  ContainerPort:
    Type: Number
    Default: 8000

  DesiredCount:
    Type: Number
    Default: 2

  MinTaskCount:
    Type: Number
    Default: 1
    Description: "Número mínimo de tasks (Auto Scaling)"

  MaxTaskCount:
    Type: Number
    Default: 10
    Description: "Número máximo de tasks (Auto Scaling)"

  CPUTargetValue:
    Type: Number
    Default: 70
    Description: "% de CPU média alvo para o Target Tracking"

  MemoryTargetValue:
    Type: Number
    Default: 75
    Description: "% de Memória média alvo para o Target Tracking"

  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]

  Memory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048", "3072", "4096", "5120", "6144", "7168", "8192", "16384", "30720"]

  AssignPublicIp:
    Type: String
    Default: "DISABLED"
    AllowedValues: ["ENABLED", "DISABLED"]

  ImageUri:
    Type: String
    Default: "181317788381.dkr.ecr.us-east-1.amazonaws.com/app_global:latest"
    Description: "Imagem completa (repo:tag). Ex: 1813...amazonaws.com/app_global:latest"

  LogRetentionDays:
    Type: Number
    Default: 14

  HealthCheckPath:
    Type: String
    Default: "/health"

  EnvironmentEmployeesTable:
    Type: String
    Default: "Employees"

  EnvironmentClockTable:
    Type: String
    Default: "ClockRecords"

  DeploymentControllerType:
    Type: String
    Default: ECS
    AllowedValues:
      - ECS
      - CODE_DEPLOY

Resources:
  # =========================
  # Log Group
  # =========================
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================
  # IAM Roles
  # =========================
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-ecs-task-inline"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/app-global-prd-clock"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/app-global-prd-employees"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/app-global-prd-points"

  EcsAutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-autoscaling-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole

  # =========================
  # ECS Cluster
  # =========================
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"

  # =========================
  # Security Group do Service
  # =========================
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      GroupDescription: !Sub "SG for ${ProjectName} ECS Service"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: "Allow ALB to reach ECS tasks"
          IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroupId
      SecurityGroupEgress:
        - Description: "Egress"
          IpProtocol: -1
          CidrIp: !Ref ServiceSecurityGroupEgressCidr
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecs-svc-sg"

  # =========================
  # Target Group (IP) + Listener Rule
  # =========================
  AppTargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${ProjectName}-blue-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !Ref HealthCheckPath
      Matcher:
        HttpCode: "200-399"

  AppTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${ProjectName}-green-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !Ref HealthCheckPath
      Matcher:
        HttpCode: "200-399"

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          Values:
            - !Ref PathPattern
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroupBlue

  # =========================
  # Task Definition
  # =========================
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Family: !Sub "${ProjectName}-task"
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${ProjectName}-container"
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "curl -f http://localhost:${ContainerPort}/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          Environment:
            - Name: EMPLOYEES_TABLE
              Value: "EMPLOYEES_TABLE"
            - Name: CLOCK_TABLE
              Value: "CLOCK_TABLE"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # =========================
  # ECS Service
  # =========================
  EcsService:
    Type: AWS::ECS::Service
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn:
      - ListenerRule
    Properties:
      ServiceName: !Sub "${ProjectName}-service"
      Cluster: !Ref EcsCluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentController:
        Type: !Ref DeploymentControllerType
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          AssignPublicIp: !Ref AssignPublicIp
      LoadBalancers:
        - ContainerName: !Sub "${ProjectName}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref AppTargetGroupBlue
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50

  # =========================
  # Auto Scaling
  # =========================
  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: EcsService
    Properties:
      MinCapacity: !Ref MinTaskCount
      MaxCapacity: !Ref MaxTaskCount
      ResourceId: !Sub "service/${EcsCluster}/${EcsService.Name}"
      RoleARN: !GetAtt EcsAutoScalingRole.Arn
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-cpu-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CPUTargetValue
        ScaleInCooldown: 120    # espera 2 min antes de remover tasks
        ScaleOutCooldown: 60    # espera 1 min antes de adicionar tasks
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  ScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-memory-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref MemoryTargetValue
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization

Outputs:
  ClusterName:
    Value: !Ref EcsCluster

  ServiceName:
    Value: !Ref EcsService

  TargetGroupArn:
    Value: !Ref AppTargetGroupBlue

  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup

  TaskExecutionRoleArn:
    Value: !GetAtt EcsTaskExecutionRole.Arn

  TaskRoleArn:
    Value: !GetAtt EcsTaskRole.Arn

  AutoScalingRoleArn:
    Value: !GetAtt EcsAutoScalingRole.Arn
