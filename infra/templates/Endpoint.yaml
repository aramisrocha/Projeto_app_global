AWSTemplateFormatVersion: "2010-09-09"
Description: VPC Endpoints for ECR, S3, CloudWatch Logs, and STS — allows private subnet resources to reach AWS services without internet access

Parameters:
  ProjectName:
    Type: String

  Environment:
    Type: String

  VPC:
    Type: AWS::EC2::VPC::Id

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id

  PrivateRouteTable:
    Type: String

Resources:

  # Shared security group for all Interface endpoints — allows HTTPS inbound from within the VPC only
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      GroupDescription: !Sub "${ProjectName}-${Environment}-endpoint-sg"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-endpoint-sg"

  # Allows ECS tasks to call the ECR control plane API (authentication, image metadata) without internet
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # Allows ECS tasks to pull container image layers from ECR without internet
  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # Gateway endpoint for S3 — required by ECR to fetch image layers stored in S3
  # Gateway type routes traffic via the route table at no additional cost
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTable

  # Allows ECS tasks to ship logs to CloudWatch without internet
  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # Allows ECS tasks to assume IAM roles via STS without internet — required by Boto3 and AWS SDKs
  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  DynamoDBGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"

      RouteTableIds:
        - !Ref PrivateRouteTable
Outputs:
  EndpointSecurityGroupId:
    Description: "Endpoint security group ID"
    Value: !Ref EndpointSecurityGroup

  EcrApiEndpointId:
    Description: "ECR API VPC Endpoint ID"
    Value: !Ref EcrApiEndpoint

  EcrDkrEndpointId:
    Description: "ECR DKR VPC Endpoint ID"
    Value: !Ref EcrDkrEndpoint

  S3GatewayEndpointId:
    Description: "S3 Gateway VPC Endpoint ID"
    Value: !Ref S3GatewayEndpoint

  CloudWatchLogsEndpointId:
    Description: "CloudWatch Logs VPC Endpoint ID"
    Value: !Ref CloudWatchLogsEndpoint
    
  DynamoDBGatewayEndpointId:
    Description: ID do VPC Endpoint DynamoDB Gateway
    Value: !Ref DynamoDBGatewayEndpoint  