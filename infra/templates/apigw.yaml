AWSTemplateFormatVersion: '2010-09-09'
Description: HTTP API v2 with VPC Link integration to internal ALB + Custom Domain

Parameters:
  ProjectName:
    Type: String

  Environment:
    Type: String

  VpcLinkId:
    Type: String

  AlbHttpListenerArn:
    Type: String

  ApiCustomDomainName:
    Type: String
    Default: apiglobal.aramislabs.click

  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:181317788381:certificate/fae7c3ad-e22b-4cc1-a055-f32bd357e039

  CognitoUserPoolId:
    Type: String
    Default: us-east-1_GCFSRJXoU

  CognitoAppClientId:
    Type: String
    Default: 1oeaodsmtgvqthl36301eh612a


  HostedZoneId:
    Type: String
    Default: Z00421932FD8154X80J2A

  # Global API name shared by both regions; Route 53 latency routing picks the closest healthy region
  GlobalApiDomainName:
    Type: String
    Default: api.aramislabs.click

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
          - https://www.aramislabs.click
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
# JWT Authorizer for protected API Gateway routes, authentication handled by Cognito, federated via Okta as the external IdP
  CognitoJwtAuthorizer:
     Type: AWS::ApiGatewayV2::Authorizer
     Properties:
       ApiId: !Ref HttpApi
       AuthorizerType: JWT
       IdentitySource:
         - $request.header.Authorization
       Name: Auth_cognito
       JwtConfiguration:
         Audience:
           - !Ref CognitoAppClientId
         Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
# Routes API Gateway requests to the internal ALB via VPC Link  
  AlbVpcLinkIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref VpcLinkId
      PayloadFormatVersion: "1.0"
      IntegrationUri: !Ref AlbHttpListenerArn
# Every application route requires a valid JWT; only GET /health below is public
  ProtectedProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${AlbVpcLinkIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer

  HealthGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /health"
      Target: !Sub "integrations/${AlbVpcLinkIntegration}"

# Default stage with auto-deploy enabled 
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
# Custom domain for the API with a regional ACM certificate
  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
# Binds the API to the custom domain, mapping the default stage to the root path
  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn:
      - ApiStage
      - ApiCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiCustomDomainName
      Stage: !Ref ApiStage
      ApiMappingKey: ""
# Route53 alias record pointing the custom API domain to the regional API Gateway endpoint
  ApiCustomDomainRecord:
    Type: AWS::Route53::RecordSet
    DependsOn:
      - ApiCustomDomain
      - ApiDomainMapping
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${ApiCustomDomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId
# Global custom domain served by this region too, so TLS and host routing work on api.aramislabs.click
  GlobalApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref GlobalApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  GlobalApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn:
      - ApiStage
      - GlobalApiCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref GlobalApiDomainName
      Stage: !Ref ApiStage
      ApiMappingKey: ""
# End-to-end health check through API Gateway, VPC Link, ALB and ECS on the public /health route
  ApiHealthCheck:
    Type: AWS::Route53::HealthCheck
    DependsOn: ApiCustomDomainRecord
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !Ref ApiCustomDomainName
        ResourcePath: /health
        Port: 443
        RequestInterval: 30
        FailureThreshold: 3
      HealthCheckTags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-api-${AWS::Region}"
# Latency record for this region; Route 53 drops it while the health check fails, sending users to the other region
  GlobalApiLatencyRecord:
    Type: AWS::Route53::RecordSet
    DependsOn: GlobalApiDomainMapping
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${GlobalApiDomainName}."
      Type: A
      SetIdentifier: !Sub "api-${AWS::Region}"
      Region: !Ref AWS::Region
      HealthCheckId: !Ref ApiHealthCheck
      AliasTarget:
        DNSName: !GetAtt GlobalApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt GlobalApiCustomDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

Outputs:
  HttpApiId:
    Description: HTTP API Id
    Value: !Ref HttpApi

  DefaultExecuteApiUrl:
    Description: Default execute-api URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/"

  CustomDomainName:
    Description: Custom domain name
    Value: !Ref ApiCustomDomainName

  CustomDomainUrl:
    Description: Custom domain invoke URL
    Value: !Sub "https://${ApiCustomDomainName}/"

  RegionalApiGatewayDomainName:
    Description: Regional API Gateway target domain
    Value: !GetAtt ApiCustomDomain.RegionalDomainName