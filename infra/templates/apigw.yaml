AWSTemplateFormatVersion: '2010-09-09'
Description: HTTP API v2 with VPC Link integration to internal ALB + Custom Domain

Parameters:
  ProjectName:
    Type: String

  Environment:
    Type: String

  VpcLinkId:
    Type: String

  AlbHttpListenerArn:
    Type: String

  ApiCustomDomainName:
    Type: String
    Default: apiglobal.aramislabs.click

  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:181317788381:certificate/fae7c3ad-e22b-4cc1-a055-f32bd357e039

  CognitoUserPoolId:
    Type: String
    Default: us-east-1_GCFSRJXoU

  CognitoAppClientId:
    Type: String
    Default: 1oeaodsmtgvqthl36301eh612a


  HostedZoneId:
    Type: String
    Default: Z00421932FD8154X80J2A

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
          - https://www.aramislabs.click
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
# JWT Authorizer for protected API Gateway routes, authentication handled by Cognito, federated via Okta as the external IdP
  CognitoJwtAuthorizer:
     Type: AWS::ApiGatewayV2::Authorizer
     Properties:
       ApiId: !Ref HttpApi
       AuthorizerType: JWT
       IdentitySource:
         - $request.header.Authorization
       Name: Auth_cognito
       JwtConfiguration:
         Audience:
           - !Ref CognitoAppClientId
         Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
# Routes API Gateway requests to the internal ALB via VPC Link  
  AlbVpcLinkIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref VpcLinkId
      PayloadFormatVersion: "1.0"
      IntegrationUri: !Ref AlbHttpListenerArn
# Protected routes JWT required: GET|POST /employees, GET|POST /clock, GET /clock/{employee_id}
# Public route: GET /health without auth
  EmployeesGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /employees"
      Target: !Sub "integrations/${AlbVpcLinkIntegration}"
      AuthorizationType: JWT 
      AuthorizerId: !Ref CognitoJwtAuthorizer

  EmployeesPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /employees"
      Target: !Sub "integrations/${AlbVpcLinkIntegration}"
      AuthorizationType: JWT 
      AuthorizerId: !Ref CognitoJwtAuthorizer

  ClockGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /clock"
      Target: !Sub "integrations/${AlbVpcLinkIntegration}"
      AuthorizationType: JWT 
      AuthorizerId: !Ref CognitoJwtAuthorizer

  ClockPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /clock"
      Target: !Sub "integrations/${AlbVpcLinkIntegration}"
      AuthorizationType: JWT 
      AuthorizerId: !Ref CognitoJwtAuthorizer

  ClockEmployeeIdGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /clock/{employee_id}"
      Target: !Sub "integrations/${AlbVpcLinkIntegration}"
      AuthorizationType: JWT 
      AuthorizerId: !Ref CognitoJwtAuthorizer

  HealthGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /health"
      Target: !Sub "integrations/${AlbVpcLinkIntegration}"

# Default stage with auto-deploy enabled 
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
# Custom domain for the API with a regional ACM certificate
  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
# Binds the API to the custom domain, mapping the default stage to the root path
  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn:
      - ApiStage
      - ApiCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiCustomDomainName
      Stage: !Ref ApiStage
      ApiMappingKey: ""
# Route53 alias record pointing the custom API domain to the regional API Gateway endpoint
  ApiCustomDomainRecord:
    Type: AWS::Route53::RecordSet
    DependsOn:
      - ApiCustomDomain
      - ApiDomainMapping
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${ApiCustomDomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId

Outputs:
  HttpApiId:
    Description: HTTP API Id
    Value: !Ref HttpApi

  DefaultExecuteApiUrl:
    Description: Default execute-api URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/"

  CustomDomainName:
    Description: Custom domain name
    Value: !Ref ApiCustomDomainName

  CustomDomainUrl:
    Description: Custom domain invoke URL
    Value: !Sub "https://${ApiCustomDomainName}/"

  RegionalApiGatewayDomainName:
    Description: Regional API Gateway target domain
    Value: !GetAtt ApiCustomDomain.RegionalDomainName