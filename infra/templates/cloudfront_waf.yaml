AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFront + S3 Website + WAF

Parameters:
  BucketName:
    Type: String  

  DomainName:
    Type: String
    Default: www.aramislabs.click

  S3WebsiteEndpoint1:
    Type: String
    Default: aramis-app-global-regiao01-prd.s3-website-us-east-1.amazonaws.com
    
  S3WebsiteEndpoint2:
    Type: String
    Default: aramis-app-global-regiao02-prod.s3-website-eu-west-1.amazonaws.com 

Resources:


# WAFv2 WebACL attached to CloudFront, allows traffic by default, rules override on match
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: app-global-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: app-global-waf
      Rules:
# Blocks requests from IPs flagged by AWS threat intelligence 
        - Name: AWSManagedIPReputation
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesAmazonIpReputationList
              VendorName: AWS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation
# Protects against OWASP Top 10 threats: SQL injection, XSS, and HTTP protocol violations
        - Name: AWSManagedCommonRules
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesCommonRuleSet
              VendorName: AWS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: common-rules
# Rejects requests matching known exploit signatures, including Log4Shell and other vulnerability probes
        - Name: AWSManagedKnownBadInputs
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesKnownBadInputsRuleSet
              VendorName: AWS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: bad-inputs


# CloudFront Distribution

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: App Global CDN

        Aliases:
          - !Ref DomainName

        DefaultRootObject: index.html
# Static frontend assets are served from S3 buckets deployed in both regions us-east-1 and eu-west-1
        Origins:
          - Id: S3OriginRegion1
            DomainName: !Ref S3WebsiteEndpoint1
            CustomOriginConfig:
              OriginProtocolPolicy: http-only

          - Id: S3OriginRegion2
            DomainName: !Ref S3WebsiteEndpoint2
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
# Failover criteria: CloudFront switches to the secondary S3 origin on 403, 404, or 500 responses
        OriginGroups:
          Quantity: 1
          Items:
            - Id: S3OriginGroup
              FailoverCriteria:
                StatusCodes:
                  Quantity: 3
                  Items:
                    - 403
                    - 404
                    - 500
              Members:
                Quantity: 2
                Items:
                  - OriginId: S3OriginRegion1
                  - OriginId: S3OriginRegion2

        DefaultCacheBehavior:
          TargetOriginId: S3OriginGroup
  # Enforces HTTPS-only traffic, HTTP requests are automatically redirected to HTTPS
          ViewerProtocolPolicy: redirect-to-https 
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized AWS Managed
# PriceClass_All enables all CloudFront edge locations globally, maximizing coverage at the cost of higher distribution fees
        PriceClass: PriceClass_All
# TLS terminated at CloudFront edge via ACM hosted in us-east-1, SNI-only and WAF enforced
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:181317788381:certificate/fae7c3ad-e22b-4cc1-a055-f32bd357e039
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
#  Attaches the WAF WebACL to inspect all incoming requests at the edge
        WebACLId: !GetAtt WebACL.Arn

Outputs:
  CloudFrontURL:
    Description: CloudFront Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName