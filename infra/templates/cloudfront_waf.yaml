AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFront + S3 Website + WAF

Parameters:
  BucketName:
    Type: String  

  DomainName:
    Type: String
    Default: www.aramislabs.click

  S3WebsiteEndpoint1:
    Type: String
    Default: aramis-app-global-regiao01-prd.s3-website-us-east-1.amazonaws.com
    
  S3WebsiteEndpoint2:
    Type: String
    Default: aramis-app-global-regiao02-prod.s3-website-eu-west-1.amazonaws.com 

Resources:

# -----------------------------
# WAF Web ACL
# -----------------------------
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: app-global-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: app-global-waf
      Rules:

        - Name: AWSManagedIPReputation
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesAmazonIpReputationList
              VendorName: AWS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation

        - Name: AWSManagedCommonRules
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesCommonRuleSet
              VendorName: AWS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: common-rules

        - Name: AWSManagedKnownBadInputs
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesKnownBadInputsRuleSet
              VendorName: AWS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: bad-inputs

# -----------------------------
# CloudFront Distribution
# -----------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: App Global CDN

        Aliases:
          - !Ref DomainName

        DefaultRootObject: index.html

        Origins:
          - Id: S3OriginRegion1
            DomainName: !Ref S3WebsiteEndpoint1
            CustomOriginConfig:
              OriginProtocolPolicy: http-only

          - Id: S3OriginRegion2
            DomainName: !Ref S3WebsiteEndpoint2
            CustomOriginConfig:
              OriginProtocolPolicy: http-only

        OriginGroups:
          Quantity: 1
          Items:
            - Id: S3OriginGroup
              FailoverCriteria:
                StatusCodes:
                  Quantity: 3
                  Items:
                    - 403
                    - 404
                    - 500
              Members:
                Quantity: 2
                Items:
                  - OriginId: S3OriginRegion1
                  - OriginId: S3OriginRegion2

        DefaultCacheBehavior:
          TargetOriginId: S3OriginGroup
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true

        PriceClass: PriceClass_All

        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:181317788381:certificate/fae7c3ad-e22b-4cc1-a055-f32bd357e039
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        WebACLId: !GetAtt WebACL.Arn

Outputs:
  CloudFrontURL:
    Description: CloudFront Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName