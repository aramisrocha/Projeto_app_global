AWSTemplateFormatVersion: "2010-09-09"
Description: "Root stack - creates Network layer using nested stack (templates/network.yaml)"

Parameters:
  ProjectName:
    Type: String
    Default: "Projeto-APP-Global"
    Description: "Nome Projeto"

  Environment:
    Type: String
    Default: "PRODR2"
    AllowedValues: ["PROD", "PRODR2"]
    Description: "Variaveis para definir "

  # 
  TemplateBucket:
    Type: String
    Description: "S3 bucket that stores CloudFormation templates"

  TemplatePrefix:
    Type: String
    Default: "artifacts/cloudformation"
    Description: "S3 prefix/folder where templates are stored"

  # Parâmetros repassados ao módulo de rede
  VpcCidr:
    Type: String
    Default: "10.1.0.0/16"

  PublicSubnet1Cidr:
    Type: String
    Default: "10.1.1.0/24"

  PublicSubnet2Cidr:
    Type: String
    Default: "10.1.2.0/24"

  EnableDnsHostnames:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  EnableDnsSupport:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  
  DomainName:
    Type: String
    Default: www.aramislabs.click
    
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      # O arquivo precisa estar no S3 nesse camin
      # s3://<TemplateBucket>/<TemplatePrefix>/templates/network.yaml
      #TemplateURL: !Sub "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}/templates/network.yaml"
      TemplateURL: templates/network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        PublicSubnet1Cidr: !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr: !Ref PublicSubnet2Cidr
        EnableDnsHostnames: !Ref EnableDnsHostnames
        EnableDnsSupport: !Ref EnableDnsSupport    
  
  # Subindo aplication load balance
  AlbStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/alb.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        #PublicSubnetIds: !Split [",", !GetAtt NetworkStack.Outputs.PublicSubnetIds]
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds         

# ECS
  EcsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/ECS.yaml
      Parameters:
        ProjectName: "app-global"
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        #PrivateSubnetIds: !Split [",", !GetAtt NetworkStack.Outputs.PublicSubnetIds]
        #PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds 
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        #PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        AlbSecurityGroupId: !GetAtt AlbStack.Outputs.AlbSecurityGroupId
        AlbListenerArn: !GetAtt AlbStack.Outputs.AlbHttpListenerArn
        ListenerRulePriority: 10
        PathPattern: "/*"
        ContainerPort: 8000
        DesiredCount: 2
        AssignPublicIp: "ENABLED"
        #ImageUri: "181317788381.dkr.ecr.us-east-1.amazonaws.com/app_global:build-29"
        ImageUri: "181317788381.dkr.ecr.eu-west-1.amazonaws.com/app_global:build-30"
        HealthCheckPath: "/health"
        EnvironmentEmployeesTable: "Employees"
        EnvironmentClockTable: "ClockRecords"
  
  VpcLinkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/vpc-link.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds              

  ApiGatewayStack:
      Type: AWS::CloudFormation::Stack
      DependsOn:
        - VpcLinkStack
        - AlbStack
      Properties:
        TemplateURL: templates/apigw.yaml
        Parameters:
          ProjectName: !Ref ProjectName
          Environment: !Ref Environment
          VpcLinkId: !GetAtt VpcLinkStack.Outputs.VpcLinkId
          #AlbInternalDnsName: !GetAtt AlbStack.Outputs.AlbDnsName
          AlbHttpListenerArn: !GetAtt AlbStack.Outputs.AlbHttpListenerArn
          ApiCustomDomainName: apiglobal.aramislabs.click
          #CertificateArn: arn:aws:acm:us-east-1:181317788381:certificate/fae7c3ad-e22b-4cc1-a055-f32bd357e039
          CertificateArn: arn:aws:acm:eu-west-1:181317788381:certificate/5c8b8f1d-5195-4ca3-aef2-7b236d8382dc
          #HostedZoneName: aramislabs.click.
          #HostedZoneId: Z00421932FD8154X80J2A

# Frontend
  FrontendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ApiGatewayStack
    Properties:
      TemplateURL: templates/s3.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        BucketName:  !Sub "aramis-app-global-${Environment}"        