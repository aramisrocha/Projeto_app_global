AWSTemplateFormatVersion: "2010-09-09"
Description: "Root stack - creates Network layer using nested stack (templates/network.yaml)"

Parameters:
  ProjectName:
    Type: String
    Default: "app-global"
    Description: "Prefix used in resource names/tags"

  Environment:
    Type: String
    Default: "prd"
    AllowedValues: ["dev", "hml", "prd", "dr"]
    Description: "Environment name"

  # S3 bucket and prefix where all nested stack templates are stored
  TemplateBucket:
    Type: String
    Description: "S3 bucket that stores CloudFormation templates"

  TemplatePrefix:
    Type: String
    Default: "artifacts/cloudformation"
    Description: "S3 prefix/folder where templates are stored"

  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"

  PrivateSubnet1Cidr:
    Type: String
    Default: "10.0.1.0/24"

  PrivateSubnet2Cidr:
    Type: String
    Default: "10.0.2.0/24"

  EnableDnsHostnames:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  EnableDnsSupport:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  DomainName:
    Type: String
    Default: www.aramislabs.click

Resources:

  # Foundation layer — VPC, private subnets, and route tables
  # All other stacks depend on outputs from this stack
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        PrivateSubnet1Cidr: !Ref PrivateSubnet1Cidr
        PrivateSubnet2Cidr: !Ref PrivateSubnet2Cidr
        EnableDnsHostnames: !Ref EnableDnsHostnames
        EnableDnsSupport: !Ref EnableDnsSupport

  # VPC Endpoints for ECR, S3, CloudWatch Logs, and STS
  # Must be provisioned before ECS to ensure tasks can pull images without internet access
  EndpointsStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: templates/Endpoint.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VPC: !GetAtt NetworkStack.Outputs.VpcId
        PrivateSubnet1: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        PrivateRouteTable: !GetAtt NetworkStack.Outputs.PrivateRouteTableId

  # Internal ALB — entry point for all traffic routed from API Gateway via VPC Link
  AlbStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/alb.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds

  # DynamoDB Global Tables for points, employees, and clock — replicated across regions
  DynamoDBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/DynamoDB.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

  # ECS Fargate cluster and service — DependsOn EndpointsStack ensures VPC Endpoints
  EcsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - EndpointsStack
    Properties:
      TemplateURL: templates/ECS.yaml
      Parameters:
        ProjectName: "app-global"
        DeploymentControllerType: "CODE_DEPLOY"
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        AlbSecurityGroupId: !GetAtt AlbStack.Outputs.AlbSecurityGroupId
        AlbListenerArn: !GetAtt AlbStack.Outputs.AlbHttpListenerArn
        ListenerRulePriority: 10
        PathPattern: "/*"
        ContainerPort: 8000
        DesiredCount: 2
        AssignPublicIp: "DISABLED"
        ImageUri: "181317788381.dkr.ecr.us-east-1.amazonaws.com/app_global:build-64"
        HealthCheckPath: "/health"
        EnvironmentEmployeesTable: "Employees"
        EnvironmentClockTable: "ClockRecords"

  # VPC Link bridges API Gateway HTTP API to the internal ALB
  VpcLinkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/vpc-link.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds

  # API Gateway with JWT authorization, custom domain, and VPC Link integration
  # DependsOn ensures VPC Link and ALB are ready before routes are created
  ApiGatewayStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VpcLinkStack
      - AlbStack
    Properties:
      TemplateURL: templates/apigw.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcLinkId: !GetAtt VpcLinkStack.Outputs.VpcLinkId
        AlbHttpListenerArn: !GetAtt AlbStack.Outputs.AlbHttpListenerArn
        ApiCustomDomainName: apiglobal.aramislabs.click
        CertificateArn: arn:aws:acm:us-east-1:181317788381:certificate/fae7c3ad-e22b-4cc1-a055-f32bd357e039

  # S3 bucket configured for static website hosting — serves the frontend SPA
  FrontendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ApiGatewayStack
    Properties:
      TemplateURL: templates/s3.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        BucketName: !Sub "aramis-app-global-regiao01-${Environment}"

  # CloudFront distribution with WAF — CDN layer for the frontend S3 bucket
  # DependsOn FrontendStack ensures the S3 origin exists before the distribution is created
  CloudFrontStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: FrontendStack
    Properties:
      TemplateURL: templates/cloudfront_waf.yaml
      Parameters:
        BucketName: !GetAtt FrontendStack.Outputs.BucketName
        DomainName: !Ref DomainName

Outputs:
  VpcId:
    Description: "VPC ID (from nested NetworkStack)"
    Value: !GetAtt NetworkStack.Outputs.VpcId
    Export:
      Name: !Sub "${ProjectName}-${Environment}-VpcId"

  PrivateSubnetIds:
    Description: "Private subnet IDs (from nested NetworkStack)"
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PrivateSubnetIds"

  PublicRouteTableId:
    Description: "Private route table ID (from nested NetworkStack)"
    Value: !GetAtt NetworkStack.Outputs.PrivateRouteTableId
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PrivateRouteTableId"

  FrontendURL:
    Value: !GetAtt FrontendStack.Outputs.WebsiteURL