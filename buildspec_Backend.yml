version: 0.2

env:
  variables:
    ECR_REPO_NAME: app-global-api
    IMAGE_NAME: app
    AWS_DEFAULT_REGION: us-east-1
    ECR_REPO_URI: 181317788381.dkr.ecr.us-east-1.amazonaws.com/app_global

phases:
  pre_build:
    commands:
      - aws --version
      - export IMAGE_TAG="build-${CODEBUILD_BUILD_NUMBER}"
      - echo "IMAGE_TAG=${IMAGE_TAG}"
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${ECR_REPO_URI}

  build:
    commands:
      - echo "== Build =="
      - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -f app/Dockerfile app/
      - docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ECR_REPO_URI}:${IMAGE_TAG}

  post_build:
    commands:
      - docker push ${ECR_REPO_URI}:${IMAGE_TAG}

      - echo "Updating image in taskdef.json..."
      - sed -i "s|${ECR_REPO_URI}:latest|${ECR_REPO_URI}:${IMAGE_TAG}|g" taskdef.json

      - echo "Registering task definition..."
      - aws ecs register-task-definition --cli-input-json file://taskdef.json
      - export TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition app-global-task --query "taskDefinition.taskDefinitionArn" --output text)
      - echo "TASK_DEF_ARN=${TASK_DEF_ARN}"

      - sed -i "s|<TASK_DEFINITION>|${TASK_DEF_ARN}|g" appspec.yaml

      - echo "Generating imagedefinitions.json..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "${IMAGE_NAME}" "${ECR_REPO_URI}:${IMAGE_TAG}" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yaml
    - taskdef.json